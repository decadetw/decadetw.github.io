/* === themes.css === */
:root {
  --font-sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --nav-height: 64px;
  --max-width: 1200px;
  --radius: 14px;
  --transition: 0.25s ease;
}

html[data-theme="dark"] {
  --bg: #000000;
  --bg-gradient: radial-gradient(ellipse at 50% -10%, #10231d 0%, #000000 60%);
  --surface: #111111;
  --surface-2: #181818;
  --text: #eeeeee;
  --text-dim: #9a9a9a;
  --accent: #00e5a0;
  --accent-soft: rgba(0, 229, 160, 0.12);
  --accent-glow: 0 0 18px rgba(0, 229, 160, 0.45);
  --border: rgba(255, 255, 255, 0.12);
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.55);
  --hero-overlay: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.75) 70%, #000 100%);
}

html[data-theme="light"] {
  --bg: #ffffff;
  --bg-gradient: radial-gradient(ellipse at 50% -10%, #eef7f3 0%, #ffffff 60%);
  --surface: #f7f7f7;
  --surface-2: #efefef;
  --text: #111111;
  --text-dim: #666666;
  --accent: #00875a;
  --accent-soft: rgba(0, 135, 90, 0.10);
  --accent-glow: none;
  --border: rgba(0, 0, 0, 0.10);
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
  --hero-overlay: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.65) 70%, #fff 100%);
}

html[data-theme="brand"] {
  --bg: #0a0a0a;
  --bg-gradient: radial-gradient(ellipse at 50% -10%, #2a0505 0%, #0a0a0a 60%);
  --surface: #141414;
  --surface-2: #1c1111;
  --text: #eeeeee;
  --text-dim: #b08a8a;
  --accent: #ff2d2d;
  --accent-soft: rgba(255, 45, 45, 0.12);
  --accent-glow: 0 0 20px rgba(255, 45, 45, 0.55);
  --border: rgba(255, 80, 80, 0.25);
  --shadow: 0 8px 30px rgba(60, 0, 0, 0.6);
  --hero-overlay: linear-gradient(180deg, rgba(10,0,0,0.4) 0%, rgba(10,0,0,0.78) 70%, #0a0a0a 100%);
}

/* === style.css === */
* { box-sizing: border-box; margin: 0; padding: 0; }

.bg-fur {
  position: fixed; inset: 0; z-index: 1;
  pointer-events: none;
  mix-blend-mode: screen;
}

/* hero content must sit above the fur overlay */
.hero-inner, .nav { position: relative; z-index: 2; }

@media (prefers-reduced-motion: reduce) {
  .bg-fur { display: none; }
}

html { scroll-behavior: smooth; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
  .reveal { opacity: 1 !important; transform: none !important; }
}

body {
  font-family: var(--font-sans);
  background: var(--bg);
  background-image: var(--bg-gradient);
  color: var(--text);
  line-height: 1.6;
  transition: background-color var(--transition), color var(--transition);
}

section[id] { scroll-margin-top: calc(var(--nav-height) + 12px); }

.container { max-width: var(--max-width); margin: 0 auto; padding: 0 20px; }

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Navbar ---------- */
.nav {
  position: sticky; top: 0; z-index: 100;
  height: var(--nav-height);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  border-bottom: 1px solid var(--border);
}
.nav-inner {
  max-width: var(--max-width); margin: 0 auto; padding: 0 20px;
  height: 100%; display: flex; align-items: center; gap: 16px;
}
.nav-logo img { height: 36px; display: block; }
.nav-links { display: flex; gap: 4px; list-style: none; flex: 1; justify-content: center; }
.nav-links a {
  display: block; padding: 8px 14px; border-radius: 8px;
  color: var(--text); font-weight: 500;
}
.nav-links a:hover { background: var(--accent-soft); text-decoration: none; color: var(--accent); }
.nav-tools { display: flex; align-items: center; gap: 10px; }

.lang-toggle, .theme-picker button {
  background: none; border: 1px solid var(--border); color: var(--text);
  cursor: pointer; border-radius: 999px; font-family: inherit;
  transition: all var(--transition);
}
.lang-toggle { padding: 6px 14px; font-size: 13px; font-weight: 600; min-width: 56px; }
.lang-toggle:hover { border-color: var(--accent); color: var(--accent); }

.theme-picker { display: flex; gap: 6px; padding: 3px; border-radius: 999px; }
.theme-picker button {
  width: 26px; height: 26px; border-radius: 50%; padding: 0;
  display: grid; place-items: center; font-size: 12px;
}
.theme-picker button[data-theme-opt="dark"] { background: #000; }
.theme-picker button[data-theme-opt="light"] { background: #fff; }
.theme-picker button[data-theme-opt="brand"] { background: radial-gradient(circle at 35% 35%, #ff5b5b, #b30000); }
.theme-picker button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent), var(--accent-glow); }

.nav-burger {
  display: none; background: none; border: 1px solid var(--border);
  color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: 18px; cursor: pointer;
}

/* ---------- Hero ---------- */
.hero {
  min-height: calc(100vh - var(--nav-height));
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden; text-align: center;
}
.hero-bg { position: absolute; inset: 0; z-index: -1; }
.hero-bg .slide {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  opacity: 0; transition: opacity 2.5s ease;
}
.hero-bg .slide.active { opacity: 1; }
.hero-bg::after {
  content: ""; position: absolute; inset: 0; background: var(--hero-overlay);
}
.hero-inner { padding: 60px 20px; }
.hero h1 {
  font-size: clamp(2rem, 5.5vw, 3.6rem);
  font-weight: 800; letter-spacing: 0.04em;
  text-shadow: 0 2px 24px rgba(0,0,0,0.6);
}
.hero h1 .en-line { display: block; font-size: 0.55em; font-weight: 500; color: var(--text-dim); margin-top: 10px; letter-spacing: 0.02em; }
.hero-tagline {
  margin-top: 18px; font-size: clamp(1rem, 2vw, 1.25rem); color: var(--text-dim);
}
.hero-tagline strong { color: var(--accent); text-shadow: var(--accent-glow); font-style: normal; }
.hero-ctas { margin-top: 34px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.btn {
  display: inline-block; padding: 12px 30px; border-radius: 999px;
  font-weight: 700; font-size: 1rem; cursor: pointer; border: 1px solid transparent;
  transition: all var(--transition); font-family: inherit;
}
.btn-primary { background: var(--accent); color: var(--bg); box-shadow: var(--accent-glow); }
.btn-primary:hover { transform: translateY(-2px); text-decoration: none; filter: brightness(1.08); }
.btn-ghost { border-color: var(--border); color: var(--text); background: transparent; }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }

/* ---------- Stats ---------- */
.stats { padding: 48px 0; }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; text-align: center; }
.stat-value { font-size: clamp(1.6rem, 3.5vw, 2.6rem); font-weight: 800; color: var(--accent); text-shadow: var(--accent-glow); font-variant-numeric: tabular-nums; }
.stat-label { margin-top: 4px; color: var(--text-dim); font-size: 0.95rem; }

/* ---------- Section headers ---------- */
.section { padding: 72px 0; }
.section-head { text-align: center; margin-bottom: 44px; }
.section-head h2 {
  display: inline-block; font-size: clamp(1.5rem, 3vw, 2.1rem); font-weight: 800;
  padding-bottom: 10px; border-bottom: 3px solid var(--accent);
}
.section-head p { margin-top: 12px; color: var(--text-dim); }

/* ---------- Services ---------- */
.services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.service-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 28px 22px;
  transition: all var(--transition);
}
.service-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: var(--accent); }
.service-icon { color: var(--accent); margin-bottom: 12px; filter: drop-shadow(0 0 10px var(--accent-soft)); }
.service-icon iconify-icon { display: block; }
.service-card h3 { font-size: 1.08rem; margin-bottom: 6px; }
.service-card p { color: var(--text-dim); font-size: 0.92rem; }

/* ---------- Works ---------- */
.filter-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }
.filter-chip {
  padding: 7px 18px; border-radius: 999px; border: 1px solid var(--border);
  background: transparent; color: var(--text); cursor: pointer; font-family: inherit;
  font-size: 0.9rem; transition: all var(--transition);
}
.filter-chip[aria-pressed="true"], .filter-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.videos-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.video-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; cursor: pointer;
  transition: all var(--transition); position: relative;
}
.video-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: var(--accent); }
.video-thumb { position: relative; aspect-ratio: 16 / 9; background: var(--surface-2); }
.video-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.play-badge {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 54px; height: 54px; border-radius: 50%;
  background: rgba(0,0,0,0.65); border: 2px solid var(--accent);
  display: grid; place-items: center; color: var(--accent); font-size: 1.3rem;
  transition: all var(--transition); pointer-events: none;
}
.video-card:hover .play-badge { background: var(--accent); color: var(--bg); transform: translate(-50%, -50%) scale(1.08); }
.video-title { padding: 12px 14px; font-size: 0.92rem; font-weight: 600; line-height: 1.4; }
.video-frame { width: 100%; aspect-ratio: 16 / 9; border: 0; display: block; }
.video-empty { color: var(--text-dim); text-align: center; padding: 40px 0; grid-column: 1 / -1; }

/* ---------- Timeline ---------- */
.timeline { position: relative; max-width: 860px; margin: 0 auto; padding-left: 26px; }
.timeline::before {
  content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px;
  width: 2px; background: linear-gradient(180deg, var(--accent), var(--border));
}
.year-block { position: relative; margin-bottom: 14px; }
.year-block::before {
  content: ""; position: absolute; left: -25px; top: 20px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--accent); box-shadow: var(--accent-glow);
}
.year-toggle {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 20px; cursor: pointer; font-family: inherit;
  color: var(--text); font-size: 1.15rem; font-weight: 700;
  transition: all var(--transition);
}
.year-toggle:hover { border-color: var(--accent); }
.year-toggle .chev { transition: transform var(--transition); color: var(--accent); }
.year-block.open .year-toggle { border-color: var(--accent); background: var(--surface-2); }
.year-block.open .year-toggle .chev { transform: rotate(90deg); }
.year-list { display: none; padding: 14px 20px 8px; }
.year-block.open .year-list { display: block; }
.year-list li {
  list-style: none; padding: 7px 0 7px 20px; position: relative;
  color: var(--text); font-size: 0.95rem; border-bottom: 1px dashed var(--border);
}
.year-list li:last-child { border-bottom: none; }
.year-list li::before { content: "▸"; position: absolute; left: 0; color: var(--accent); }
.year-count { font-size: 0.8rem; color: var(--text-dim); font-weight: 500; margin-left: 10px; }

/* ---------- About ---------- */
.about-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px; align-items: start; }
.about-text p { margin-bottom: 14px; color: var(--text); opacity: 0.9; }
.about-side h3 { font-size: 1.05rem; margin: 18px 0 10px; color: var(--accent); }
.about-side ul li {
  list-style: none; padding: 6px 0 6px 18px; position: relative;
  color: var(--text-dim); font-size: 0.9rem;
}
.about-side ul li::before { content: "·"; position: absolute; left: 4px; color: var(--accent); font-weight: 900; }
.about-logo { text-align: center; margin-bottom: 8px; }
.about-logo img { height: 64px; }

/* ---------- Contact ---------- */
.contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
.contact-info dt { font-weight: 700; color: var(--accent); margin-top: 16px; font-size: 0.9rem; }
.contact-info dd { margin-top: 4px; }
.social-row { display: flex; gap: 14px; margin-top: 22px; }
.social-row a {
  width: 46px; height: 46px; border-radius: 50%;
  border: 1px solid var(--border); display: grid; place-items: center;
  font-size: 1.25rem; transition: all var(--transition);
}
.social-row a:hover { border-color: var(--accent); box-shadow: var(--accent-glow); transform: translateY(-2px); text-decoration: none; }
.line-btn { margin-top: 20px; display: inline-block; }
.map-wrap {
  border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border);
  min-height: 300px; background: var(--surface-2);
}
.map-wrap iframe { width: 100%; height: 340px; border: 0; display: block; }

/* ---------- Footer ---------- */
.site-footer { border-top: 1px solid var(--border); padding: 28px 0; text-align: center; color: var(--text-dim); font-size: 0.88rem; }

/* ---------- Back to top ---------- */
.back-top {
  position: fixed; right: 22px; bottom: 22px; z-index: 90;
  width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--accent); color: var(--bg);
  display: grid; place-items: center;
  box-shadow: var(--shadow), var(--accent-glow); opacity: 0; pointer-events: none;
  transition: opacity var(--transition), transform var(--transition);
}
.back-top.visible { opacity: 1; pointer-events: auto; }
.back-top:hover { transform: translateY(-3px); }

/* ---------- Reveal animation ---------- */
.reveal { opacity: 0; transform: translateY(26px); transition: opacity 0.7s ease, transform 0.7s ease; }
.reveal.in { opacity: 1; transform: none; }

/* ---------- Mobile ---------- */
@media (max-width: 1024px) {
  .videos-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 900px) {
  .nav-links {
    display: none; position: absolute; top: var(--nav-height); left: 0; right: 0;
    flex-direction: column; background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 10px 20px 16px; gap: 2px;
  }
  .nav-links.open { display: flex; }
  .nav-burger { display: block; }
  .services-grid { grid-template-columns: repeat(2, 1fr); }
  .videos-grid { grid-template-columns: repeat(2, 1fr); }
  .about-grid, .contact-grid { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); row-gap: 26px; }
}
@media (max-width: 600px) {
  .videos-grid { grid-template-columns: 1fr; }
  .services-grid { grid-template-columns: 1fr; }
  .lang-toggle { min-width: auto; }
}
</style>
</head>

<script>
/* === app.js === */
(function () {
  "use strict";

  var D = window.DECADE_DATA;
  var I = window.DECADE_I18N;

  var state = {
    lang: "zh",
    theme: "dark",
    filter: "all"
  };

  /* ---------- storage helpers (Safari private mode safe) ---------- */
  function storeGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function storeSet(key, val) {
    try { localStorage.setItem(key, val); } catch (e) { /* ignore */ }
  }

  function t(key) {
    return (I[state.lang] && I[state.lang][key]) || I.zh[key] || key;
  }
  function pick(obj) {
    if (!obj) return "";
    if (typeof obj === "string") return obj;
    return obj[state.lang] || obj.zh || "";
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---------- theme & language ---------- */
  function applyTheme(theme) {
    state.theme = theme;
    document.documentElement.setAttribute("data-theme", theme);
    document.querySelectorAll(".theme-picker button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.themeOpt === theme));
    });
    storeSet("decade-theme", theme);
  }
  function applyLang(lang) {
    state.lang = lang;
    document.documentElement.lang = lang === "zh" ? "zh-TW" : "en";
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.innerHTML = t(el.getAttribute("data-i18n"));
    });
    var btn = document.querySelector(".lang-toggle");
    if (btn) btn.textContent = lang === "zh" ? "EN" : "中";
    renderDynamic();
    storeSet("decade-lang", lang);
  }

  /* ---------- hero slides ---------- */
  function initHero() {
    var bg = document.querySelector(".hero-bg");
    if (!bg) return;
    D.heroSlides.forEach(function (src, i) {
      var div = document.createElement("div");
      div.className = "slide" + (i === 0 ? " active" : "");
      div.style.backgroundImage = "url('" + src + "')";
      div.onerror = function () { div.style.display = "none"; };
      bg.appendChild(div);
    });
    var slides = bg.querySelectorAll(".slide");
    if (slides.length < 2) return;
    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduceMotion) return;
    var idx = 0;
    setInterval(function () {
      slides[idx].classList.remove("active");
      idx = (idx + 1) % slides.length;
      slides[idx].classList.add("active");
    }, 5000);
  }

  /* ---------- stats ---------- */
  function renderStats() {
    var wrap = document.getElementById("stats-grid");
    if (!wrap) return;
    wrap.innerHTML = D.stats.map(function (s) {
      var num = parseInt(String(s.value).replace(/[^0-9]/g, ""), 10) || 0;
      var suffix = String(s.value).replace(/^[^0-9]*[0-9]+/, "");
      var prefix = String(s.value).slice(0, String(s.value).indexOf(suffix) - String(num).length + (suffix ? 0 : String(num).length));
      prefix = num === 0 ? "" : String(s.value).slice(0, String(s.value).indexOf(String(num)));
      return '<div class="stat reveal" data-target="' + num + '" data-prefix="' + esc(prefix) + '" data-suffix="' + esc(suffix) + '"><div class="stat-value">' + esc(prefix) + "0" + esc(suffix) +
        '</div><div class="stat-label">' + esc(t(s.labelKey)) + "</div></div>";
    }).join("");
  }

  /* ---------- stat count-up on scroll ---------- */
  var counted = new WeakSet();
  function animateCount(el) {
    if (counted.has(el)) return;
    counted.add(el);
    var target = parseInt(el.dataset.target, 10) || 0;
    var prefix = el.getAttribute("data-prefix") || "";
    var suffix = el.getAttribute("data-suffix") || "";
    var valEl = el.querySelector(".stat-value");
    var dur = 1600, start = null;
    function easeOutCubic(p) { return 1 - Math.pow(1 - p, 3); }
    function frame(ts) {
      if (!start) start = ts;
      var p = Math.min((ts - start) / dur, 1);
      valEl.textContent = prefix + Math.round(easeOutCubic(p) * target) + suffix;
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  function initCountUp() {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting && e.intersectionRatio >= 0.4) {
          animateCount(e.target);
          io.unobserve(e.target);
        }
      });
    }, { threshold: [0.4] });
    document.querySelectorAll(".stat[data-target]").forEach(function (el) {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        el.querySelector(".stat-value").textContent =
          (el.getAttribute("data-prefix") || "") + el.dataset.target + (el.getAttribute("data-suffix") || "");
      } else {
        io.observe(el);
      }
    });
  }

  /* ---------- furry background: flowing strands ---------- */
  function initFur() {
    var canvas = document.querySelector(".bg-fur");
    if (!canvas) return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    var ctx = canvas.getContext("2d");
    var W = 0, H = 0, dpr = 1;
    var strands = [];
    var mouse = { x: -9999, y: -9999 };
    var running = true;
    var STRAND_COUNT = 120, SEGMENTS = 64, SEG_LEN = 7;

    /* ---------- cursor-following spotlight ---------- */
    var spot = { x: W / 2, y: H / 2, alpha: 0 };
    function drawSpot() {
      var active = mouse.x !== -9999;
      if (active) {
        spot.x += (mouse.x - spot.x) * 0.09;
        spot.y += (mouse.y - spot.y) * 0.09;
      }
      spot.alpha += ((active ? 1 : 0) - spot.alpha) * 0.05;
      if (spot.alpha < 0.01) return;

      var radius = Math.min(W, H) * 0.38;
      var c = "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ",";
      ctx.save();
      ctx.globalCompositeOperation = "lighter";

      var g = ctx.createRadialGradient(spot.x, spot.y, 0, spot.x, spot.y, radius);
      g.addColorStop(0, c + (0.32 * spot.alpha).toFixed(3) + ")");
      g.addColorStop(0.35, c + (0.16 * spot.alpha).toFixed(3) + ")");
      g.addColorStop(0.7, c + (0.06 * spot.alpha).toFixed(3) + ")");
      g.addColorStop(1, c + "0)");
      ctx.fillStyle = g;
      ctx.fillRect(spot.x - radius, spot.y - radius, radius * 2, radius * 2);

      /* small bright core */
      var coreR = 110;
      var core = ctx.createRadialGradient(spot.x, spot.y, 0, spot.x, spot.y, coreR);
      core.addColorStop(0, "rgba(255,255,255," + (0.20 * spot.alpha).toFixed(3) + ")");
      core.addColorStop(1, c + "0)");
      ctx.fillStyle = core;
      ctx.fillRect(spot.x - coreR, spot.y - coreR, coreR * 2, coreR * 2);

      ctx.restore();
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W + "px"; canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function accentRGB() {
      var cs = getComputedStyle(document.documentElement);
      var hex = (cs.getPropertyValue("--accent") || "#00e5a0").trim().replace("#", "");
      if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
      var n = parseInt(hex || "00e5a0", 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    function makeStrand() {
      return {
        x: Math.random() * W,
        y: Math.random() * H,
        angle: Math.random() * Math.PI * 2,
        speed: 0.35 + Math.random() * 0.75,
        curl: (Math.random() - 0.5) * 0.14,
        width: 1.1 + Math.random() * 2.2,
        alpha: 0.18 + Math.random() * 0.34,
        pts: []
      };
    }
    function populate() {
      strands = [];
      for (var i = 0; i < STRAND_COUNT; i++) strands.push(makeStrand());
    }
    var rgb = [0, 229, 160];
    function step(t) {
      if (!running) return;
      ctx.clearRect(0, 0, W, H);
      drawSpot();
      var timeScale = 0.00018;
      for (var i = 0; i < strands.length; i++) {
        var s = strands[i];
        /* flow field angle: layered sines + slow drift */
        var field =
          Math.sin(s.x * 0.0022 + t * timeScale * 2.1) +
          Math.cos(s.y * 0.0019 - t * timeScale * 1.7) +
          Math.sin((s.x + s.y) * 0.0011 + t * timeScale);
        var targetAngle = field * 1.35;
        /* mouse repulsion bends nearby strands away */
        var dx = s.x - mouse.x, dy = s.y - mouse.y;
        var distSq = dx * dx + dy * dy;
        var influence = 160 * 160;
        if (distSq < influence) {
          var away = Math.atan2(dy, dx);
          var wgt = 1 - Math.sqrt(distSq) / 160;
          targetAngle = away + (targetAngle - away) * (1 - wgt * 0.8);
        }
        /* steer toward field with smoothing + individual curl */
        var diff = ((targetAngle - s.angle + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
        s.angle += diff * 0.055 + Math.sin(t * 0.001 + i) * s.curl * 0.08;

        s.x += Math.cos(s.angle) * s.speed;
        s.y += Math.sin(s.angle) * s.speed;

        /* trail of segment points = the "hair" */
        s.pts.unshift({ x: s.x, y: s.y });
        if (s.pts.length > SEGMENTS) s.pts.pop();

        ctx.beginPath();
        ctx.moveTo(s.pts[0].x, s.pts[0].y);
        /* quadratic smoothing through midpoints = silky hair curves */
        for (var j = 1; j < s.pts.length - 1; j++) {
          var prev = s.pts[j], next = s.pts[j + 1];
          ctx.quadraticCurveTo(prev.x, prev.y, (prev.x + next.x) / 2, (prev.y + next.y) / 2);
        }
        var colStr = "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ",";
        /* taper: draw the trail in 3 passes, thicker+dimmer at the tail */
        ctx.lineCap = "round";
        ctx.strokeStyle = colStr + (s.alpha * 0.30).toFixed(3) + ")";
        ctx.lineWidth = s.width * 3.4;
        ctx.stroke();
        ctx.strokeStyle = colStr + (s.alpha * 0.7).toFixed(3) + ")";
        ctx.lineWidth = s.width * 1.8;
        ctx.stroke();
        ctx.strokeStyle = colStr + Math.min(1, s.alpha * 2).toFixed(3);
        ctx.lineWidth = Math.max(0.5, s.width * 0.7);
        ctx.stroke();

        /* respawn when off-screen */
        if (s.x < -40 || s.x > W + 40 || s.y < -40 || s.y > H + 40) {
          strands[i] = makeStrand();
          if (Math.random() < 0.5) {
            var edge = Math.floor(Math.random() * 4);
            if (edge === 0) { strands[i].x = Math.random() * W; strands[i].y = -20; }
            else if (edge === 1) { strands[i].x = W + 20; strands[i].y = Math.random() * H; }
            else if (edge === 2) { strands[i].x = Math.random() * W; strands[i].y = H + 20; }
            else { strands[i].x = -20; strands[i].y = Math.random() * H; }
          }
        }
      }
      requestAnimationFrame(step);
    }

    document.addEventListener("mousemove", function (e) { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
    document.addEventListener("touchmove", function (e) {
      if (e.touches.length > 0) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
    }, { passive: true });
    document.addEventListener("mouseleave", function () { mouse.x = -9999; mouse.y = -9999; });
    window.addEventListener("resize", function () { resize(); }, { passive: true });

    /* pause when tab hidden */
    document.addEventListener("visibilitychange", function () {
      var wasRunning = running;
      running = !document.hidden;
      if (running && !wasRunning) requestAnimationFrame(step);
    });

    /* follow theme accent color changes */
    var themeObserver = new MutationObserver(function () { rgb = accentRGB(); });
    themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

    resize();
    rgb = accentRGB();
    populate();
    requestAnimationFrame(step);
  }

  /* ---------- services ---------- */
  function renderServices() {
    var wrap = document.getElementById("services-grid");
    if (!wrap) return;
    wrap.innerHTML = D.services.map(function (s) {
      return '<div class="service-card reveal"><div class="service-icon"><iconify-icon icon="' + s.icon + '" width="40"></iconify-icon></div><h3>' + esc(s.zh) + "</h3></div>";
    }).join("");
  }

  /* ---------- videos ---------- */
  function videoCard(v) {
    return '<div class="video-card reveal" data-tags="' + v.tags.join(",") + '" data-ytid="' + esc(v.id) + '" role="button" tabindex="0" aria-label="' + esc(pick(v)) + '">' +
      '<div class="video-thumb">' +
      '<img loading="lazy" alt="' + esc(pick(v)) + '" src="https://i.ytimg.com/vi/' + esc(v.id) + '/hqdefault.jpg" onerror="this.style.display=\'none\'">' +
      '<span class="play-badge"><iconify-icon icon="mdi:play" width="26"></iconify-icon></span>' +
      "</div>" +
      '<div class="video-title">' + esc(pick(v)) + "</div>" +
      "</div>";
  }
  function renderVideos() {
    var wrap = document.getElementById("videos-grid");
    if (!wrap) return;
    var list = state.filter === "all" ? D.videos : D.videos.filter(function (v) {
      return v.tags.indexOf(state.filter) !== -1;
    });
    if (!list.length) {
      wrap.innerHTML = '<p class="video-empty">' + (state.lang === "zh" ? "此分類暫無影片" : "No videos in this category") + "</p>";
      return;
    }
    wrap.innerHTML = list.map(videoCard).join("");
  }
  function activateVideo(card) {
    if (card.dataset.loaded) return;
    card.dataset.loaded = "1";
    var id = card.getAttribute("data-ytid");
    var thumb = card.querySelector(".video-thumb");
    thumb.outerHTML =
      '<iframe class="video-frame" src="https://www.youtube.com/embed/' + encodeURIComponent(id) +
      '?autoplay=1&rel=0" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';
  }
  function renderFilters() {
    var row = document.getElementById("filter-row");
    if (!row) return;
    row.innerHTML = D.filters.map(function (f) {
      return '<button class="filter-chip" aria-pressed="' + String(f.id === state.filter) +
        '" data-filter="' + esc(f.id) + '">' + esc(pick(f)) + "</button>";
    }).join("");
  }

  /* ---------- timeline ---------- */
  function renderTimeline() {
    var wrap = document.getElementById("timeline");
    if (!wrap) return;
    wrap.innerHTML = D.works.map(function (w, i) {
      return '<div class="year-block' + (i === 0 ? " open" : "") + ' reveal">' +
        '<button class="year-toggle" aria-expanded="' + String(i === 0) + '">' +
        "<span>" + w.year + '<span class="year-count">' + w.items.length +
        (state.lang === "zh" ? " 項" : (w.items.length === 1 ? " project" : " projects")) + "</span></span>" +
        '<span class="chev">▸</span>' +
        "</button>" +
        '<ul class="year-list">' + w.items.map(function (it) { return "<li>" + esc(it) + "</li>"; }).join("") + "</ul>" +
        "</div>";
    }).join("");
  }

  /* ---------- about ---------- */
  function renderAbout() {
    var text = document.getElementById("about-text");
    if (text) text.innerHTML = D.about[state.lang === "zh" ? "zh" : "en"].map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
    var media = document.getElementById("about-media");
    if (media) media.innerHTML = D.media.map(function (m) { return "<li>" + esc(m) + "</li>"; }).join("");
    var books = document.getElementById("about-books");
    if (books) books.innerHTML = D.books.map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("");
  }

  /* ---------- contact ---------- */
  function renderContact() {
    var c = D.contact;
    var info = document.getElementById("contact-info");
    if (!info) return;
    var addr = state.lang === "zh" ? c.addrZh : c.addrEn;
    info.innerHTML =
      "<dl class=\"contact-info\">" +
      "<dt>" + esc(t("contact.company")) + "</dt><dd>" + esc(c.nameZh) + "</dd>" +
      "<dt>" + esc(t("contact.address")) + "</dt><dd>" + esc(addr) + ' · <a href="' + esc(c.mapLink) + '" target="_blank" rel="noopener noreferrer">Google Map</a></dd>' +
      "<dt>" + esc(t("contact.vat")) + "</dt><dd>" + esc(c.vat) + "</dd>" +
      '<dt>' + esc(t("contact.email")) + '</dt><dd><a href="mailto:' + esc(c.email) + '">' + esc(c.email) + "</a></dd>" +
      "<dt>" + esc(t("contact.line")) + "</dt><dd>" + esc(c.line) + '</dd>' +
      "</dl>" +
      '<a class="line-btn" href="' + esc(c.lineBtn) + '" target="_blank" rel="noopener noreferrer"><img height="36" decoding="async" alt="LINE" src="https://scdn.line-apps.com/n/line_add_friends/btn/zh-Hant.png"></a>';
    document.title = state.lang === "zh"
      ? "帝凱互動科技 DECADE.TW — 互動科技解決方案"
      : "DECADE.TW — Interactive Technology Solutions";
  }

  function renderFooter() {
    var el = document.getElementById("footer-copy");
    if (!el) return;
    var tpl = state.lang === "zh" ? D.contact.copyrightZh : D.contact.copyrightEn;
    el.textContent = tpl.replace("{year}", String(new Date().getFullYear()));
  }

  /* dynamic sections re-rendered when language/filter changes */
  function renderDynamic() {
    renderStats();
    initCountUp();
    renderServices();
    renderFilters();
    renderVideos();
    renderTimeline();
    renderAbout();
    renderContact();
    renderFooter();
    observeReveals();
  }

  /* ---------- scroll reveal ---------- */
  var observer = null;
  function observeReveals() {
    if (observer) observer.disconnect();
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.querySelectorAll(".reveal").forEach(function (el) { el.classList.add("in"); });
      return;
    }
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add("in"); observer.unobserve(e.target); }
      });
    }, { threshold: 0.12 });
    document.querySelectorAll(".reveal:not(.in)").forEach(function (el) { observer.observe(el); });
  }

  /* ---------- lazy map ---------- */
  function initMap() {
    var wrap = document.getElementById("map-wrap");
    if (!wrap || wrap.dataset.mounted) return;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        var f = document.createElement("iframe");
        f.src = D.contact.mapUrl;
        f.loading = "lazy";
        f.title = "Google Map";
        f.allowFullscreen = true;
        wrap.appendChild(f);
        wrap.dataset.mounted = "1";
        io.disconnect();
      });
    }, { rootMargin: "200px" });
    io.observe(wrap);
  }

  /* ---------- events ---------- */
  function bindEvents() {
    document.querySelector(".lang-toggle").addEventListener("click", function () {
      applyLang(state.lang === "zh" ? "en" : "zh");
    });
    document.querySelectorAll(".theme-picker button").forEach(function (b) {
      b.addEventListener("click", function () { applyTheme(b.dataset.themeOpt); });
    });
    var burger = document.querySelector(".nav-burger");
    var links = document.getElementById("nav-links");
    burger.addEventListener("click", function () { links.classList.toggle("open"); });
    links.addEventListener("click", function (e) {
      if (e.target.tagName === "A") links.classList.remove("open");
    });

    var main = document.getElementById("main");
    main.addEventListener("click", function (e) {
      var chip = e.target.closest(".filter-chip");
      if (chip) {
        state.filter = chip.dataset.filter;
        renderFilters();
        renderVideos();
        observeReveals();
        return;
      }
      var yearBtn = e.target.closest(".year-toggle");
      if (yearBtn) {
        var block = yearBtn.parentElement;
        block.classList.toggle("open");
        yearBtn.setAttribute("aria-expanded", String(block.classList.contains("open")));
        return;
      }
      var card = e.target.closest(".video-card");
      if (card) activateVideo(card);
    });
    main.addEventListener("keydown", function (e) {
      if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("video-card")) {
        e.preventDefault();
        activateVideo(e.target);
      }
    });

    var backTop = document.querySelector(".back-top");
    window.addEventListener("scroll", function () {
      backTop.classList.toggle("visible", window.scrollY > 400);
    }, { passive: true });
    backTop.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });
  }

  /* ---------- boot ---------- */
  function boot() {
    applyTheme(storeGet("decade-theme") || "dark");
    bindEvents();
    applyLang(storeGet("decade-lang") || "zh");
    initHero();
    initFur();
    initMap();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();</script>
</body>
</html>
